name: organization-dev

x-backend-environment: &backend-environment
  APP_NAME: Organization
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: ${APP_KEY:?Run python3 scripts/bootstrap.py}
  APP_URL: ${APP_URL}
  APP_LOCALE: fa
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_DATABASE: organization_app
  DB_USERNAME: organization_app
  DB_PASSWORD: ${APP_DB_PASSWORD}
  CACHE_STORE: redis
  CACHE_PREFIX: organization_cache_
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_PREFIX: organization_database_
  SESSION_DRIVER: redis
  SESSION_CONNECTION: default
  SESSION_COOKIE: organization_session
  SESSION_SECURE_COOKIE: "false"
  SESSION_SAME_SITE: lax
  QUEUE_CONNECTION: sync
  OIDC_ISSUER: http://localhost:8081/auth/realms/organization-dev
  OIDC_INTERNAL_ISSUER: http://keycloak:8080/auth/realms/organization-dev
  OIDC_CLIENT_ID: organization-backend
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
  CAMUNDA_URL: http://camunda:8080
  CAMUNDA_CLIENT_ID: organization-process
  CAMUNDA_CLIENT_SECRET: ${CAMUNDA_CLIENT_SECRET}

x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/backend/Dockerfile
  environment: *backend-environment
  volumes:
    - ./backend:/app
    - backend-vendor:/app/vendor
  networks: [application]

x-frontend: &frontend
  build:
    context: .
    dockerfile: infra/docker/frontend/Dockerfile
  environment:
    CHOKIDAR_USEPOLLING: ${WATCH_POLLING:-false}
    NUXT_TELEMETRY_DISABLED: "1"
  volumes:
    - ./frontend:/app
    - frontend-modules:/app/node_modules
  networks: [application]

services:
  postgres:
    restart: unless-stopped
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      CAMUNDA_DB_PASSWORD: ${CAMUNDA_DB_PASSWORD}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/initialize.sh:/docker-entrypoint-initdb.d/10-services.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [application]
    mem_limit: 384m

  redis:
    restart: unless-stopped
    image: redis:8.2.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [application]
    mem_limit: 128m

  backend-init:
    <<: *backend
    command: [initialize]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  backend:
    restart: unless-stopped
    <<: *backend
    init: true
    depends_on:
      backend-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, php, -r, 'exit(@file_get_contents("http://127.0.0.1:8000/api/health") === false ? 1 : 0);']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 384m

  frontend-init:
    <<: *frontend
    command: [initialize]
    restart: "no"

  frontend:
    restart: unless-stopped
    <<: *frontend
    init: true
    depends_on:
      frontend-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 2g

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8081/auth
      KC_HOSTNAME_ADMIN: http://localhost:8083/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    volumes:
      - ./.runtime/realm.json:/opt/keycloak/data/import/organization-dev.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /auth/health/ready HTTP/1.0\r\n\r\n" >&3; head -n 1 <&3 | grep -q "200"''']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [application]
    mem_limit: 768m

  camunda-init:
    image: camunda/camunda:8.9.27
    user: "0:0"
    entrypoint: [/bin/sh, -c, 'chown -R 1001:1001 /usr/local/camunda/data /usr/local/camunda/camunda-data']
    volumes:
      - camunda-data:/usr/local/camunda/data
      - camunda-secondary:/usr/local/camunda/camunda-data
    networks: [application]
    restart: "no"

  camunda:
    restart: unless-stopped
    image: camunda/camunda:8.9.27
    environment:
      CAMUNDA_CLIENT_SECRET: ${CAMUNDA_CLIENT_SECRET}
      CAMUNDA_DB_PASSWORD: ${CAMUNDA_DB_PASSWORD}
      DEMO_USERNAME: ${DEMO_USERNAME}
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m -Dhttp.proxyHost=nginx -Dhttp.proxyPort=8081 -Dhttp.nonProxyHosts=
    volumes:
      - camunda-data:/usr/local/camunda/data
      - camunda-secondary:/usr/local/camunda/camunda-data
      - ./infra/camunda/application.yaml:/usr/local/camunda/config/application.yaml:ro
    depends_on:
      nginx: { condition: service_started }
      camunda-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/9600; printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3; head -n 1 <&3 | grep -q "200"''']
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [application]
    mem_limit: 1400m

  pgadmin:
    restart: unless-stopped
    image: dpage/pgadmin4:9.10
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1/misc/ping")']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
    networks: [application]
    mem_limit: 512m

  nginx:
    restart: unless-stopped
    image: nginx:1.28.0-alpine
    ports:
      - 127.0.0.1:8081:8081
      - 127.0.0.1:8082:8082
      - 127.0.0.1:8083:8083
      - 127.0.0.1:8084:8084
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/proxy-headers.inc:/etc/nginx/conf.d/proxy-headers.inc:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
      pgadmin: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8081/api/health']
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [application]
    mem_limit: 64m

networks:
  application:
    driver: bridge
volumes:
  postgres-data:
  redis-data:
  backend-vendor:
  frontend-modules:
  camunda-data:
  camunda-secondary:
  pgadmin-data:
