map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8081;
    server_name localhost;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header X-Forwarded-Port 8081;
    }
    location /identity/secondary/admin/ { return 404; }
    location /identity/secondary/ {
        set $secondary http://keycloak-secondary:8080;
        proxy_pass $secondary;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header X-Forwarded-Port 8081;
    }
    location /auth/admin/ { return 404; }
    location /auth/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header X-Forwarded-Port 8081;
    }
    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header X-Forwarded-Port 8081;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
server {
    listen 8082;
    server_name localhost;
    location / {
        set $pgadmin http://pgadmin:80;
        proxy_pass $pgadmin;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header X-Forwarded-Port 8082;
    }
}
server {
    listen 8083;
    server_name localhost;
    location = / { return 302 http://localhost:8083/auth/admin/; }
    location /identity/secondary/ {
        set $secondary http://keycloak-secondary:8080;
        proxy_pass $secondary;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header X-Forwarded-Port 8083;
    }
    location /auth/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header X-Forwarded-Port 8083;
    }
}
server {
    listen 8084;
    server_name localhost;
    location = / { return 302 http://localhost:8084/operate; }
    location / {
        set $camunda http://camunda:8080;
        proxy_pass $camunda;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header X-Forwarded-Port 8084;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
